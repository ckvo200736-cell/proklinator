<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проклинатор 3000</title>
<style>
  :root { --bg:#120a1c; --card:#1e1230; --accent:#a855f7; --accent2:#f43f5e; --text:#f1e8ff; --muted:#9d8bb8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    background: radial-gradient(circle at 50% 0%, #2d1650 0%, var(--bg) 60%); color:var(--text);
    font-family: system-ui, "Segoe UI", sans-serif; }
  .card { width:100%; max-width:460px; background:var(--card); border:1px solid #3b2560; border-radius:20px;
    padding:28px 22px; box-shadow:0 0 40px rgba(168,85,247,.25); text-align:center; }
  .skull { font-size:56px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(4deg); } }
  h1 { margin:6px 0 4px; font-size:28px; letter-spacing:1px; }
  .sub { color:var(--muted); margin-bottom:22px; font-size:14px; }
  label { display:block; text-align:left; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:13px 14px; font-size:16px; border-radius:12px; border:1px solid #4a2f78;
    background:#150c24; color:var(--text); outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  button { width:100%; margin-top:22px; padding:15px; font-size:17px; font-weight:700; color:#fff; cursor:pointer;
    border:0; border-radius:12px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #list { max-height:240px; overflow-y:auto; border:1px solid #4a2f78; border-radius:12px; background:#150c24; text-align:left; -webkit-overflow-scrolling:touch; }
  #list div { padding:12px 14px; border-bottom:1px solid #2a1946; cursor:pointer; font-size:15px; }
  #list div:last-child { border-bottom:0; }
  #list div.on { background:linear-gradient(90deg,var(--accent),var(--accent2)); font-weight:700; }
  .reason { color:var(--text); margin-top:6px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { margin:0; padding:10px; font-size:14px; background:#2a1946; }
  .tabs button.on { background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  #board { text-align:left; }
  .item { background:#150c24; border:1px solid #3b2560; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .item .who { font-size:13px; color:var(--muted); }
  .item .who b { color:var(--text); }
  .item .t { font-weight:700; margin:4px 0 2px; }
  .item .c, .item .r { font-size:13px; color:var(--muted); font-style:italic; }
  .empty { text-align:center; color:var(--muted); padding:20px 0; }
  .hidden { display:none; }
  .bar { height:12px; background:#150c24; border-radius:99px; overflow:hidden; margin:18px 0 10px; border:1px solid #4a2f78; }
  .bar > div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s; }
  #status { color:var(--muted); min-height:22px; font-size:14px; }
  .result h2 { color:var(--accent2); margin:6px 0; }
  .result .curse { font-size:20px; font-weight:700; margin:10px 0 6px; }
  .result .comment { color:var(--muted); font-style:italic; }
  .again { background:#3b2560; margin-top:18px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform:translateX(-6px);} 75% { transform:translateX(6px);} }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="skull">💀</div>
  <h1>Проклинатор 3000</h1>
  <div class="sub">Сертифицированная порча. Побочные эффекты — смех.</div>

  <div class="tabs">
    <button id="tabCurse" class="on">😈 Проклясть</button>
    <button id="tabBoard">📜 Доска</button>
  </div>
  <noscript><p style="color:#f43f5e;font-weight:700">⚠️ Здесь отключён JavaScript, проклятия не заработают. Нажми «Поделиться» → «Открыть в Safari».</p></noscript>
  <div id="main">
  <div id="form">
    <label for="name">Кого проклинаем?</label>
    <input id="name" type="text" maxlength="40" placeholder="Введи имя жертвы" autocomplete="off">
    <label for="from">Твоё имя / псевдоним (необязательно)</label>
    <input id="from" type="text" maxlength="30" placeholder="Если пусто — будет «Аноним»" autocomplete="off">
    <label for="reason">За что? (необязательно)</label>
    <input id="reason" type="text" maxlength="80" placeholder="Например: съел(а) мой йогурт" autocomplete="off">
    <label>Выбери проклятье</label>
    <div id="list"></div>
    <div id="customBox" class="hidden">
      <label for="customTitle">Твоё проклятье</label>
      <input id="customTitle" type="text" maxlength="60" placeholder="Например: вечный дубль в ушах" autocomplete="off">
      <label for="customComment">Комментарий (необязательно)</label>
      <input id="customComment" type="text" maxlength="120" placeholder="Пояснение к проклятью" autocomplete="off">
    </div>
    <button id="go">Проклясть! 😈</button>
  </div>

  <div id="loading" class="hidden">
    <div class="bar"><div id="fill"></div></div>
    <div id="status"></div>
  </div>

  <div id="result" class="result hidden">
    <div style="font-size:48px">✅</div>
    <h2>Проклятье отправлено!</h2>
    <div>Получатель: <b id="rName"></b></div>
    <div class="reason hidden" id="rReason"></div>
    <div class="curse" id="rCurse"></div>
    <div class="comment" id="rComment"></div>
    <div class="comment" id="rBoard" style="margin-top:10px"></div>
    <button class="again" id="again">Проклясть ещё кого-нибудь</button>
  </div>
  </div>
  <div id="board" class="hidden"></div>
</div>

<script>
const CURSES = [
  ["Вечный понос", ["Каждый поход в гости заканчивается забегом в туалет. Пусть всегда будет рядом хотя бы одна дверь.", "Туалет теперь твоя вторая гостиная. Рекомендуем повесить там вайфай.", "Лучшие идеи будут приходить только в кабинке, а выйти с ними не получится.", "Даже самый вкусный ужин теперь будет сопровождаться тревожным взглядом на дверь."]],
  ["Бессонница", ["Спать хочется всегда, кроме момента, когда ложишься в кровать.", "Мозг будет включаться ровно в тот миг, когда выключается свет.", "Ты станешь экспертом по потолку. Особенно по трещинке слева.", "Будильник прозвенит ровно через минуту после того, как ты наконец уснёшь."]],
  ["Мысли в 3 ночи", ["Вспоминать самый неловкий момент из 2011 года ровно в три часа ночи.", "Каждую ночь мозг будет показывать сборник лучших фейлов. С комментариями.", "В 3:00 всплывёт вопрос, выключен ли утюг. Утюга у тебя нет.", "Ты будешь спорить с человеком, которого не видел(а) десять лет. И проигрывать."]],
  ["Зелёные светофоры", ["Все светофоры на твоём пути загораются зелёным. Опаздывать станет нечем.", "Даже самые вредные перекрёстки будут подмигивать тебе зелёным глазом.", "Ты будешь проезжать город «зелёной волной». Таксисты в шоке.", "Даже на пешеходном переходе тебе будет гореть «иди»."], true],
  ["Вечно разряженный телефон", ["Всегда 1%. Зарядка есть у всех, кроме тех, кто рядом.", "Батарея будет падать с 40% до 3% во время одного видео.", "Провод от зарядки всегда будет на 10 см короче, чем нужно.", "Заряжаться он начнёт, только если ты выйдешь из дома без пауэрбанка."]],
  ["Носок-одиночка", ["Каждый носок из пары будет бесследно пропадать. Остальные тоже.", "Стиральная машина теперь питается носками. Ей виднее.", "У тебя будет десять левых носков и ни одного правого.", "Пара найдётся ровно в тот день, когда потеряется второй."]],
  ["Мизинец vs. тумбочка", ["Каждое утро один незапланированный контакт мизинца с мебелью.", "Тумбочка будет двигаться по ночам. Она точно там раньше не стояла.", "Звук удара услышат соседи. Крик тоже.", "Больно будет сильнее, чем кажется возможным для такого маленького пальца."]],
  ["Чихание в самый тихий момент", ["Желательно на лекции, в тишине, с эхом.", "На минуте молчания. Громко. Два раза подряд.", "Чих будет звучать как гусь, которому наступили на хвост.", "Именно в тот момент, когда ты прячешься от кого-то за углом."]],
  ["Идеальный авокадо", ["Всегда спелый. Не каменный и не кашица. Ровно в тот день, когда нужен.", "Он будет раскрываться без борьбы, а косточка выпрыгнет сама.", "Тосты с авокадо получатся как в кафе. Нет, лучше.", "Каждый разрез будет идеально зелёным. Без коричневых пятен."], true],
  ["Мокрый носок", ["Наступить в лужу ровно одним носком. Весь день.", "Мокрый носок будет ощущаться как личное оскорбление.", "Он высохнет ровно к вечеру. А утром история повторится.", "Хлюпать при каждом шаге ты будешь только в самой тихой тишине."]],
  ["Автокорректор-предатель", ["Все сообщения будут исправляться на самое неловкое слово.", "«Целую» превратится во что-то, что лучше не отправлять начальнику.", "Он будет исправлять даже правильные слова. Особенно важные.", "Ты напишешь «ща буду», а получится то, за что придётся извиняться."]],
  ["Вечная очередь", ["Ты всегда в той очереди, которая движется медленнее всех.", "Перед тобой всегда будет человек с ворохом чеков и вопросов.", "Как только перейдёшь в другую очередь, прежняя поедет быстрее.", "Кассир уйдёт на обед ровно перед тобой."]],
  ["Музыкальный червь", ["В голове навсегда застрянет «Ламбада». Только припев.", "Песня будет играть на фоне любых важных разговоров.", "Ты начнёшь мурлыкать её на самых серьёзных встречах.", "Другую песню вспомнить не получится. Даже не пытайся."]],
  ["Деньги в старой куртке", ["Раз в месяц находить в кармане купюру, о которой давно забыл(а).", "Это будет ровно та сумма, которой не хватало на кофе.", "Иногда карман подарит ещё и любимую конфету.", "Деньги будут находиться в самый нужный день. Магия."], true],
  ["Зуд в недоступном месте", ["Ровно посередине спины. Там, где не достать.", "Чесаться будет всегда, когда руки заняты.", "Спасёт только угол двери. И косые взгляды.", "Зуд перебежит на другое место, как только ты доберёшься до первого."]],
  ["Пустой холодильник", ["Открываешь его каждые 5 минут. Там всё равно ничего нового.", "Свет в холодильнике будет смотреть на тебя с укором.", "Все продукты будут «почти» годными, чтобы выбросить было жалко.", "Единственный йогурт окажется чужим. И просроченным."]],
  ["Скрипучая дверь", ["В 2 ночи, когда пытаешься тихо пройти. Каждый раз.", "Скрипеть будет именно та половица, которую ты не учёл(а).", "Скрип будет на уровне оперной арии. С эхом.", "Дверь начнёт скрипеть только после полуночи."]],
  ["Подтекающий пакет", ["Сумка с продуктами порвётся ровно у подъезда.", "Яйца упадут первыми. Всегда.", "Пакет выдержит всю дорогу, но сдастся в двух шагах от дома.", "Апельсины разбегутся по двору. Один из них поймает соседка."]],
  ["Тёплый плед и дождь за окном", ["Вечер, когда никуда не надо, а под рукой чай и сериал.", "Плед будет идеальной температуры, а чай ещё не остынет.", "Дождь будет стучать нежно, как колыбельная.", "Телефон будет молчать, а настроение будет уютным."], true],
  ["Икота на свидании", ["Громкая. Ритмичная. Не лечится ни водой, ни испугом.", "Начнётся в самый романтичный момент. Обязательно в паузе.", "Звучать она будет как маленький пингвин. Очень настойчивый.", "Остановится сразу, как только расплатишься по счёту."]],
  ["Вечный спойлер", ["Все будут рассказывать концовку сериала, который ты ещё не досмотрел.", "Спойлер окажется прямо в названии серии или в превью.", "Ты узнаешь, кто убийца, ещё до того, как найдут жертву.", "Даже случайный прохожий скажет «а потом он умрёт»."]],
  ["Маленькая заноза", ["Не видна, не вытащить, зато ощущается при каждом движении.", "Заноза переедет в самое неудобное место. Очень уважает логистику.", "Ты будешь трогать это место постоянно и снова натыкаться.", "Выйдет сама через неделю. Если вообще выйдет."]],
  ["Проспать будильник", ["Но только в тот день, когда это реально важно.", "Будильник сработает. Ты выключишь его во сне и даже поблагодаришь.", "Проснёшься с мыслью «ещё пять минуточек». Прошло три часа.", "Во сне будильник превратится в приятную мелодию. Очень вредную."]],
  ["Любимая песня в нужный момент", ["Заходишь в магазин или такси, а там играет именно она.", "Песня заиграет в тот самый момент, когда тебе это нужно.", "Ты будешь подпевать, и никто не осудит.", "Ты поймаешь любимую песню по радио с самого начала."], true],
  ["Всегда не та вкладка", ["Звук откуда-то орёт, а найти вкладку невозможно. Вечно.", "Ты закроешь двадцать вкладок. Шум останется.", "Реклама будет громче любого видео, что ты смотрел(а).", "Вкладка найдётся в самом конце. Конечно же, свёрнутая."]],
  ["✍️ Придумать своё", [""]]
];
const CUSTOM = CURSES.length - 1;

const MESSAGES = [
  "Связываюсь с потусторонним миром…",
  "Варю зелье из носков и дедлайнов…",
  "Ищу адрес жертвы в астрале…",
  "Будим древних духов (они злые, не выспались)…",
  "Подключаюсь к демонскому вайфаю…",
  "Заряжаю проклятье на 99%…",
  "Отправляю сову с уведомлением…",
  "Почти готово, духи спорят о цене…",
  "Посыпаю проклятье блёстками…",
  "Натачиваю вилы для пущего эффекта…",
  "Читаю заклинание задом наперёд…",
  "Уточняю у чёрного кота, всё ли правильно…",
  "Консультируюсь с ведьмой из соседнего подъезда…",
  "Смазываю метлу для быстрой доставки…",
  "Проверяю, не просрочено ли проклятье…",
  "Подкупаю привидение за срочность…",
  "Мешаю в котле всё, что нашлось в холодильнике…",
  "Прошу домового не мешать…",
  "Зажигаю свечку, которую жалко…",
  "Складываю проклятье в конвертик с печатью…"
];

const MESSAGES_KIND = [
  "Собираю лучики солнца…",
  "Завариваю волшебный чай…",
  "Договариваюсь с добрыми духами…",
  "Посыпаю проклятье блёстками…",
  "Упаковываю удачу в красивую коробочку…",
  "Грею проклятье в ладошках…",
  "Отправляю с голубем-курьером…",
  "Почти готово, духи улыбаются…",
  "Обнимаю проклятье перед отправкой…",
  "Завязываю бантик покрасивее…",
  "Шепчу проклятью тёплые слова…",
  "Прошу радугу составить компанию…",
  "Поливаю проклятье любовью…",
  "Договариваюсь с котиком о мурчании…",
  "Рисую на проклятье улыбку…",
  "Подбираю самый уютный цвет…"
];

function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const $ = id => document.getElementById(id);
let chosen = 0;
CURSES.forEach((c, i) => {
  const d = document.createElement("div");
  d.textContent = c[0];
  if (i === 0) d.className = "on";
  d.onclick = () => {
    chosen = i;
    $("customBox").classList.toggle("hidden", i !== CUSTOM);
    [...$("list").children].forEach((x, j) => x.className = j === i ? "on" : "");
  };
  $("list").appendChild(d);
});

$("go").onclick = () => {
  const name = $("name").value.trim();
  if (!name) { const n = $("name"); n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake"); n.focus(); return; }
  let [title, comments, isKind] = CURSES[chosen];
  let comment = pickOne(comments);
  if (chosen === CUSTOM) {
    title = $("customTitle").value.trim();
    if (!title) { const c = $("customTitle"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); c.focus(); return; }
    comment = $("customComment").value.trim() || "Авторское проклятье, штучная работа.";
  }
  const reason = $("reason").value.trim();
  const from = $("from").value.trim() || "Аноним";
  const posted = store.add({ from, to: name, curse: title, comment, reason, t: Date.now() }).then(() => true, () => false);
  $("form").classList.add("hidden");
  $("loading").classList.remove("hidden");

  const msgs = shuffle(isKind ? MESSAGES_KIND : MESSAGES).slice(0, 8);
  let p = 0;
  const timer = setInterval(() => {
    p = Math.min(100, p + Math.random() * 5 + 4);
    $("fill").style.width = p + "%";
    $("status").textContent = msgs[Math.min(msgs.length - 1, Math.floor(p / 100 * msgs.length))];
    if (p >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        $("loading").classList.add("hidden");
        $("rName").textContent = name;
        $("rReason").textContent = reason ? "Причина: " + reason : "";
        $("rReason").classList.toggle("hidden", !reason);
        posted.then(ok => { $("rBoard").textContent = ok ? "Проклятье записано на доску 📜" : "Не вышло записать на доску 😢"; });
        $("rCurse").textContent = "«" + title + "»";
        $("rComment").textContent = comment;
        $("result").classList.remove("hidden");
      }, 400);
    }
  }, 400);
};

$("again").onclick = () => {
  $("result").classList.add("hidden");
  $("fill").style.width = "0";
  $("name").value = "";
  $("reason").value = "";
  $("from").value = "";
  $("customTitle").value = "";
  $("customComment").value = "";
  $("form").classList.remove("hidden");
};
function fmt(t) {
  const d = new Date(t);
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}
function el(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; return d; }

async function renderBoard() {
  const b = $("board");
  let list;
  try { list = await store.load(); } catch (e) { b.replaceChildren(el("empty", "Не удалось загрузить доску 😢")); return; }
  if (!list.length) { b.replaceChildren(el("empty", "Пока ни одного проклятья. Будь первым!")); return; }
  b.replaceChildren(...list.map(x => {
    const d = el("item", "");
    const who = el("who", "");
    const f = document.createElement("b"); f.textContent = x.from;
    const t = document.createElement("b"); t.textContent = x.to;
    who.append(f, " → ", t, " · " + fmt(x.t));
    d.append(who, el("t", "«" + x.curse + "»"), el("c", x.comment));
    if (x.reason) d.append(el("r", "Причина: " + x.reason));
    return d;
  }));
}

let poll;
function show(tab) {
  const board = tab === "board";
  $("tabBoard").classList.toggle("on", board);
  $("tabCurse").classList.toggle("on", !board);
  $("board").classList.toggle("hidden", !board);
  $("main").classList.toggle("hidden", board);
  clearInterval(poll);
  if (board) { renderBoard(); poll = setInterval(renderBoard, 15000); }
}
$("tabBoard").onclick = () => show("board");
$("tabCurse").onclick = () => show("curse");

$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
